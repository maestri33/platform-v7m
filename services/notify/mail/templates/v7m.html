<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>{{title}}</title>
  <style>p{margin:0 0 16px}ul,ol{margin:0 0 16px;padding-left:22px}a{color:#f1d58f}code{font-family:Consolas,monospace}</style>
</head>
<body style="margin:0;padding:0;background:#101112;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:#f5f3ee">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#101112;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#18191b;border:1px solid #35322a;border-radius:18px;overflow:hidden">
        <tr><td style="padding:30px 36px 26px;background:#18191b;color:#ffffff;border-bottom:1px solid #4f4327">
          <div style="font-size:11px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;color:#d9b65d">Rede de promotores</div>
          <div style="margin-top:6px;font-size:30px;font-weight:800;letter-spacing:-1px;color:#ffffff">V7M<span style="color:#d9b65d">.</span></div>
          <div style="margin-top:8px;font-size:14px;line-height:1.45;color:#b9b7b0">Cadastro, indicações, treinamento e comissões.</div>
        </td></tr>
        <tr><td style="height:5px;background:#d9b65d;font-size:0;line-height:0">&nbsp;</td></tr>
        <tr><td style="padding:38px 36px 14px">
          <h1 style="margin:0 0 18px;font-size:24px;line-height:1.25;color:#ffffff">{{title}}</h1>
          <div style="font-size:16px;line-height:1.65;color:#ddd9cf">{{content}}</div>
        </td></tr>
        <tr><td style="padding:22px 36px 38px">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:10px;background:#d9b65d">
            <a href="https://app.maestri.group" target="_blank" style="display:inline-block;padding:14px 24px;color:#17140d;text-decoration:none;font-size:15px;font-weight:700">Abrir painel V7M</a>
          </td></tr></table>
        </td></tr>
        <tr><td style="padding:28px 36px;background:#121315;border-top:1px solid #2b2c2f;color:#b9b7b0">
          <div style="margin-bottom:14px;font-size:13px;line-height:1.8">
            <a href="https://app.maestri.group" target="_blank" style="color:#f1d58f;text-decoration:none;margin-right:16px">Painel</a>
            <a href="https://maestri.group/termos/" target="_blank" style="color:#f1d58f;text-decoration:none;margin-right:16px">Termos</a>
            <a href="https://maestri.group/privacidade/" target="_blank" style="color:#f1d58f;text-decoration:none">Privacidade</a>
          </div>
          <div style="font-size:12px;line-height:1.7;color:#85837d">Esta mensagem trata do seu cadastro, treinamento, indicações ou comissões na V7M.<br>CNPJ 48.811.016/0001-00 · v7m.org</div>
        </td></tr>
      </table>
      <div style="padding:14px 24px;color:#777872;font-size:11px"><a href="https://v7m.org" target="_blank" style="color:#9d9e98;text-decoration:none">v7m.org</a></div>
    </td></tr>
  </table>
</body>
</html>
