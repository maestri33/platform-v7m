<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>{{title}}</title>
  <style>p{margin:0 0 16px}ul,ol{margin:0 0 16px;padding-left:22px}a{color:#012169}code{font-family:Consolas,monospace}</style>
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:#172033">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #dfe3e8;border-radius:16px;overflow:hidden">
        <tr><td style="padding:24px 32px;background:#172033;color:#ffffff;font-size:20px;font-weight:700">{{service_name}}</td></tr>
        <tr><td style="padding:36px 32px 28px">
          <h1 style="margin:0 0 18px;font-size:24px;line-height:1.25;color:#172033">{{title}}</h1>
          <div style="font-size:16px;line-height:1.65;color:#344054">{{content}}</div>
        </td></tr>
        <tr><td style="padding:22px 32px;background:#f8fafc;border-top:1px solid #e5e7eb;color:#667085;font-size:12px;line-height:1.6">Mensagem transacional enviada por {{service_name}}.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
