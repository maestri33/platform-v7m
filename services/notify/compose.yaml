name: notify

x-notify: &notify
  build:
    context: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://notify:${POSTGRES_PASSWORD:-notify-local-password}@postgres:5432/notify
    EVOLUTION_GO_BASE_URL: http://evolution-go:4000
    EVOLUTION_GO_API_KEY: ${EVOLUTION_GO_API_KEY:-notify-local-go-key}
    # Key ADMIN da GO pós-ativação de licença (a GO rotaciona a global ao ativar).
    # Valor real vive no .env — ver /license/status ou o env do container evolution-go.
    EVOLUTION_GO_ADMIN_KEY: ${EVOLUTION_GO_ADMIN_KEY:-}
    OMNIROUTER_URL: http://tts-fake:5000
    OMNIROUTER_API_KEY: ${OMNIROUTER_API_KEY:-tk_tts_local_dev}
    SECRET_KEY: ${SECRET_KEY:-notify-local-development-only-secret-key}
    DEBUG: ${DEBUG:-1}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,notify-web}
    # URL que os CONTAINERS usam para alcançar o notify (webhooks das Evolutions).
    EXTERNAL_URL: http://notify-web:8000
    # URL que o navegador/usuário usa para mídia (QR, áudio) — porta publicada.
    MEDIA_LAN_BASE: http://127.0.0.1:${NOTIFY_HOST_PORT:-8000}
    MEDIA_ROOT: /app/media
    # Override TEST_MODE aqui só se quiser dry-run permanente. Padrão: herda do .env.
    TEST_MODE: ${TEST_MODE:-0}
  volumes:
    - notify_media:/app/media
    - notify_data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notify-local-password}
      POSTGRES_DB: postgres
      NOTIFY_DB_PASSWORD: ${POSTGRES_PASSWORD:-notify-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-notify-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  evolution-go:
    image: evoapicloud/evolution-go:0.7.2
    environment:
      SERVER_PORT: 4000
      POSTGRES_AUTH_DB: postgresql://evogo:${POSTGRES_PASSWORD:-notify-local-password}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evogo:${POSTGRES_PASSWORD:-notify-local-password}@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      CLIENT_NAME: notify
      GLOBAL_API_KEY: ${EVOLUTION_GO_API_KEY:-notify-local-go-key}
      EVOLUTION_OPERATOR_EMAIL: ${EVOLUTION_OPERATOR_EMAIL:-}
      CONNECT_ON_STARTUP: "false"
      WEBHOOK_FILES: "true"
      WADEBUG: INFO
      LOGTYPE: console
    volumes:
      - evolution_go_data:/app/dbdata
      - evolution_go_logs:/app/logs
    ports:
      - "127.0.0.1:${EVOLUTION_GO_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/server/ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  notify-web:
    <<: *notify
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py notify_schedules && python manage.py notify_bootstrap && gunicorn notify_server.wsgi:application --bind 0.0.0.0:8000 --workers 1 --access-logfile -"]
    ports:
      - "127.0.0.1:${NOTIFY_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s

  notify-worker:
    <<: *notify
    command: ["python", "manage.py", "qcluster"]
    depends_on:
      notify-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if b'qcluster' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  evolution_go_data:
  evolution_go_logs:
  notify_media:
  notify_data:
