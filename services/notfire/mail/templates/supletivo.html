<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>{{title}}</title>
  <style>p{margin:0 0 16px}ul,ol{margin:0 0 16px;padding-left:22px}a{color:#012169}code{font-family:Consolas,monospace}</style>
</head>
<body style="margin:0;padding:0;background:#f3f7f2;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:#10231a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f7f2;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #dce7dd;border-radius:18px;overflow:hidden">
        <tr><td style="padding:30px 36px 26px;background:#009c3b;color:#ffffff">
          <div style="font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#ffdf00">supletivo.net.br</div>
          <div style="margin-top:7px;font-size:28px;font-weight:800;letter-spacing:-0.6px">Supletivo <span style="color:#ffdf00">Brasil</span></div>
          <div style="margin-top:8px;font-size:14px;line-height:1.45;color:#e8f5ec">Seu próximo passo na educação.</div>
        </td></tr>
        <tr><td style="height:6px;background:#ffdf00;font-size:0;line-height:0">&nbsp;</td></tr>
        <tr><td style="padding:38px 36px 14px">
          <h1 style="margin:0 0 18px;font-size:24px;line-height:1.25;color:#10231a">{{title}}</h1>
          <div style="font-size:16px;line-height:1.65;color:#344b3b">{{content}}</div>
        </td></tr>
        <tr><td style="padding:22px 36px 38px">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:10px;background:#012169">
            <a href="https://app.supletivo.net.br" target="_blank" style="display:inline-block;padding:14px 24px;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700">Acessar minha área</a>
          </td></tr></table>
        </td></tr>
        <tr><td style="padding:28px 36px;background:#012169;color:#dce5f5">
          <div style="margin-bottom:14px;font-size:13px;line-height:1.8">
            <a href="https://app.supletivo.net.br" target="_blank" style="color:#ffffff;text-decoration:none;margin-right:16px">Minha área</a>
            <a href="https://supletivo.net.br/termos/" target="_blank" style="color:#ffffff;text-decoration:none;margin-right:16px">Termos</a>
            <a href="https://supletivo.net.br/privacidade/" target="_blank" style="color:#ffffff;text-decoration:none">Privacidade</a>
          </div>
          <div style="font-size:12px;line-height:1.7;color:#aebbd3">Esta mensagem trata da sua matrícula, estudos ou documentos no Supletivo Brasil.<br>CNPJ 48.811.016/0001-00 · Tecnologia V7M.</div>
        </td></tr>
      </table>
      <div style="padding:14px 24px;color:#66756b;font-size:11px"><a href="https://supletivo.net.br" target="_blank" style="color:#66756b;text-decoration:none">supletivo.net.br</a></div>
    </td></tr>
  </table>
</body>
</html>
