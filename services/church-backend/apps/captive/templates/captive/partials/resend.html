<div class="resend-area" id="resend-area">
  {% if resend_error %}<div style="color:#FF3B1F; margin-bottom:6px;">{{ resend_error }}</div>{% endif %}
  {% if resent %}<div class="gold" style="margin-bottom:6px;">Código reenviado ✓</div>{% endif %}
  <span data-cooldown="{{ resend_cooldown }}">
    <span class="resend-wait">Reenviar código em <span class="gold countdown">1:00</span></span>
    <button type="button" class="resend-btn" hidden
            hx-post="{% url 'captive:htmx-otp-resend' %}"
            hx-vals='{"sid": "{{ sid }}"}'
            hx-target="#resend-area" hx-swap="outerHTML">Reenviar código</button>
  </span>
</div>
