<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb;">
            <tr>
              <td style="padding:28px 32px;background:#0f172a;color:#ffffff;">
                <div style="font-size:12px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.8;">Notification</div>
                <div style="margin-top:12px;font-size:28px;font-weight:700;line-height:1.2;">
                  {{ title_html|safe }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <div style="font-size:16px;line-height:1.7;">
                  {{ content_html|safe }}
                </div>
                {% if has_media %}
                <div style="margin-top:28px;padding:20px;border-radius:14px;background:#f8fafc;border:1px solid #dbe4ea;">
                  <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#64748b;">Mídia</div>
                  <div style="margin-top:8px;font-size:18px;font-weight:700;color:#0f172a;">{{ media_kind_label }}</div>
                  {% if media_summary %}
                  <div style="margin-top:8px;color:#334155;">{{ media_summary }}</div>
                  {% endif %}
                  {% if attachment_name %}
                  <div style="margin-top:12px;display:inline-block;padding:8px 12px;border-radius:999px;background:#e2e8f0;color:#0f172a;font-size:13px;">
                    {{ attachment_name }}
                  </div>
                  {% endif %}
                  {% if media_reference_url %}
                  <div style="margin-top:16px;">
                    <a href="{{ media_reference_url }}" style="display:inline-block;padding:10px 16px;border-radius:999px;background:#0f172a;color:#ffffff;text-decoration:none;font-weight:700;">Abrir mídia</a>
                  </div>
                  {% endif %}
                </div>
                {% endif %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
