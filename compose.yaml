name: notify

x-notify: &notify
  build:
    context: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://notify:${POSTGRES_PASSWORD:-notify-local-password}@postgres:5432/notify
    WHATSAPP_API_BASE_URL: http://evolution-v2:8080
    EVOLUTION_GO_BASE_URL: http://evolution-go:4000
    OMNIROUTER_URL: http://tts-fake:5000
    OMNIROUTER_API_KEY: ${OMNIROUTER_API_KEY:-tk_tts_local_dev}
    SECRET_KEY: ${SECRET_KEY:-notify-local-development-only-secret-key}
    DEBUG: ${DEBUG:-1}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,notify-web}
    EXTERNAL_URL: http://127.0.0.1:${NOTIFY_HOST_PORT:-8000}
    MEDIA_LAN_BASE: http://notify-web:8000
    MEDIA_ROOT: /app/media
    # Override TEST_MODE aqui só se quiser dry-run permanente. Padrão: herda do .env.
    TEST_MODE: ${TEST_MODE:-0}
  volumes:
    - notify_media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    tts-fake:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notify-local-password}
      POSTGRES_DB: postgres
      NOTIFY_DB_PASSWORD: ${POSTGRES_PASSWORD:-notify-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-notify-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  evolution-v2:
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution-v2:8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:-notify-local-password}@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: notify
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${WHATSAPP_GLOBAL_API_KEY:-notify-local-v2-key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      TELEMETRY_ENABLED: "false"
      QRCODE_LIMIT: 30
      CONFIG_SESSION_PHONE_CLIENT: Notify
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes:
      - evolution_v2_instances:/evolution/instances
    ports:
      - "127.0.0.1:${EVOLUTION_V2_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  evolution-go:
    image: evoapicloud/evolution-go:0.7.2
    environment:
      SERVER_PORT: 4000
      POSTGRES_AUTH_DB: postgresql://evogo:${POSTGRES_PASSWORD:-notify-local-password}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evogo:${POSTGRES_PASSWORD:-notify-local-password}@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      CLIENT_NAME: notify
      GLOBAL_API_KEY: ${EVOLUTION_GO_API_KEY:-notify-local-go-key}
      EVOLUTION_OPERATOR_EMAIL: ${EVOLUTION_OPERATOR_EMAIL:-}
      CONNECT_ON_STARTUP: "false"
      WEBHOOK_FILES: "true"
      WADEBUG: INFO
      LOGTYPE: console
    volumes:
      - evolution_go_data:/app/dbdata
      - evolution_go_logs:/app/logs
    ports:
      - "127.0.0.1:${EVOLUTION_GO_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/server/ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  tts-fake:
    build:
      context: ./docker/tts-fake
    environment:
      OMNIROUTER_API_KEY: ${OMNIROUTER_API_KEY:-tk_tts_local_dev}
      PORT: "5000"
    ports:
      - "127.0.0.1:${TTS_FAKE_HOST_PORT:-15000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

  notify-web:
    <<: *notify
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn notify_server.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"]
    ports:
      - "127.0.0.1:${NOTIFY_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  notify-worker:
    <<: *notify
    command: ["python", "manage.py", "qcluster"]
    depends_on:
      postgres:
        condition: service_healthy
      notify-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if b'qcluster' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  evolution_v2_instances:
  evolution_go_data:
  evolution_go_logs:
  notify_media:
