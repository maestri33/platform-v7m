{% if internet_released %}
<div id="net-status"
     class="inline-flex items-center gap-2 rounded-full bg-success/15 px-3 py-1.5 text-[13px] text-success">
  <span class="size-2 rounded-full bg-success"></span>Você já está conectado
</div>
{% else %}
<div id="net-status"
     class="inline-flex items-center gap-2 rounded-full bg-warning/15 px-3 py-1.5 text-[13px] text-warning"
     hx-get="{% url 'captive:htmx-status' %}?sid={{ sid }}"
     hx-trigger="every 3s" hx-swap="outerHTML">
  <span class="size-2 animate-pulse rounded-full bg-warning"></span>Liberando sua internet…
</div>
{% endif %}
