<section>
    <form hx-post="/contato/religion/evangelical/" hx-swap="none" class="row g-3">
        {% csrf_token %}
        <input type="hidden" name="religion" value="{{ body_context.religion }}">
        <input type="hidden" name="christianity_type" value="{{ body_context.christianity_type }}">
        <div class="col-12">
            <label for="evangelical_church_name" class="form-label">Nome da igreja</label>
            <input id="evangelical_church_name" type="text" name="evangelical_church_name" value="{{ body_context.evangelical_church_name }}" class="form-control">
        </div>
        <fieldset class="col-12">
            <legend class="col-form-label pt-0">Está em comunhão?</legend>
            <div class="form-check">
                <input id="evangelical_is_in_communion_true" type="radio" name="evangelical_is_in_communion" value="true" {% if body_context.evangelical_is_in_communion == "true" %}checked{% endif %} class="form-check-input">
                <label for="evangelical_is_in_communion_true" class="form-check-label">Sim</label>
            </div>
            <div class="form-check">
                <input id="evangelical_is_in_communion_false" type="radio" name="evangelical_is_in_communion" value="false" {% if body_context.evangelical_is_in_communion == "false" %}checked{% endif %} class="form-check-input">
                <label for="evangelical_is_in_communion_false" class="form-check-label">Não</label>
            </div>
        </fieldset>
        <div class="col-12 d-grid">
            <button type="submit" class="btn btn-primary">Continuar</button>
        </div>
    </form>
</section>
