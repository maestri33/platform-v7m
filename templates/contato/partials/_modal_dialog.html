{% if modal_message %}
<dialog id="contact-modal" open class="contact-dialog border-0 rounded-4 shadow-lg p-0"{% if modal_oob %} hx-swap-oob="outerHTML"{% endif %}>
    <div class="p-4">
        <div class="d-flex justify-content-between align-items-start gap-3">
            <p class="mb-0">{{ modal_message }}</p>
            <button
                type="button"
                class="btn-close"
                aria-label="Fechar"
                hx-get="/contato/modal/blank/"
                hx-target="#contact-modal"
                hx-swap="outerHTML"
            ></button>
        </div>
    </div>
</dialog>
{% else %}
<div id="contact-modal"{% if modal_oob %} hx-swap-oob="outerHTML"{% endif %}></div>
{% endif %}
