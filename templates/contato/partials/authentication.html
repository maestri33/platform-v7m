<section>
    {% include "contato/partials/_stage_header.html" %}

    <form
        hx-post="/contato/authentication/"
        hx-swap="none"
        novalidate
        class="vstack gap-3"
    >
        {% csrf_token %}

        <div>
            <label for="phone" class="form-label">Digite seu WhatsApp</label>
            <input
                id="phone"
                type="tel"
                name="phone"
                inputmode="numeric"
                autocomplete="tel-national"
                enterkeyhint="send"
                required
                class="form-control"
            >
        </div>

        <input type="hidden" name="is_in_person" value="{% if is_in_person %}true{% else %}false{% endif %}">

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Entrar</button>
        </div>
    </form>
</section>
