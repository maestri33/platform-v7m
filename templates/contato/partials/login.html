<section>
    {% include "contato/partials/_stage_header.html" %}

    <div class="vstack gap-3">
        <form hx-post="/contato/login/" hx-swap="none" class="row g-3">
            {% csrf_token %}
            <input type="hidden" name="profile_uuid" value="{{ profile_uuid }}">

            <div class="col-12">
                <label for="otp" class="form-label">Código</label>
                <input id="otp" type="text" name="otp" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" class="form-control">
            </div>

            <div class="col-12 d-grid">
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>
        </form>

        <form hx-post="/contato/restart/" hx-swap="none" class="d-grid">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary">Tentar com outro número</button>
        </form>
    </div>
</section>
