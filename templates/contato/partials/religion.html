<section>
    {% include "contato/partials/_stage_header.html" %}

    <div>
        {% include "contato/partials/_stage_meta.html" %}

        <form hx-post="/contato/religion/prepare/" hx-swap="none" class="row g-3">
            {% csrf_token %}
            <div class="col-12">
                <label for="religion" class="form-label">Religião</label>
                <select id="religion" name="religion" class="form-select">
                    <option value="">Selecione</option>
                    {% for option in options.religion %}
                    <option value="{{ option.value }}"{% if option.value == religious_data.religion %} selected{% endif %}>{{ option.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12 d-grid d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-primary px-4">Continuar</button>
            </div>
        </form>

        <div id="contact-religion-detail" class="mt-3"></div>
    </div>
</section>
