<section>
    {% include "contato/partials/_stage_header.html" %}

    <div>
        {% include "contato/partials/_stage_meta.html" %}

        <form hx-post="/contato/data/" hx-swap="none" class="row g-3">
            {% csrf_token %}
            <div class="col-12">
                <label for="full_name" class="form-label">Nome</label>
                <input id="full_name" type="text" name="full_name" value="{{ profile.full_name }}" class="form-control">
            </div>
            <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" name="email" value="{{ profile.email }}" class="form-control">
            </div>
            <div class="col-12 col-md-6">
                <label for="date_of_birth" class="form-label">Data de nascimento</label>
                <input id="date_of_birth" type="date" name="date_of_birth" value="{{ profile.date_of_birth|date:'Y-m-d' }}" class="form-control">
            </div>
            <div class="col-12 col-md-6">
                <label for="gender" class="form-label">Gênero</label>
                <select id="gender" name="gender" class="form-select">
                    <option value="">Selecione</option>
                    {% for option in options.gender %}
                    <option value="{{ option.value }}"{% if option.value == profile.gender %} selected{% endif %}>{{ option.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12 col-md-6">
                <label for="marital_status" class="form-label">Estado civil</label>
                <select id="marital_status" name="marital_status" class="form-select">
                    <option value="">Selecione</option>
                    {% for option in options.marital_status %}
                    <option value="{{ option.value }}"{% if option.value == profile.marital_status %} selected{% endif %}>{{ option.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12 d-grid d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-primary px-4">Continuar</button>
            </div>
        </form>
    </div>
</section>
