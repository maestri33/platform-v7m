<section>
    {% include "contato/partials/_stage_header.html" %}

    <div>
        {% include "contato/partials/_stage_meta.html" %}

        <form hx-post="/contato/data/" hx-swap="none">
            {% csrf_token %}
            <div>
                <label for="full_name">Nome</label>
                <input id="full_name" type="text" name="full_name" value="{{ profile.full_name }}">
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" type="email" name="email" value="{{ profile.email }}">
            </div>
            <div>
                <label for="date_of_birth">Data de nascimento</label>
                <input id="date_of_birth" type="date" name="date_of_birth" value="{{ profile.date_of_birth|date:'Y-m-d' }}">
            </div>
            <div>
                <label for="gender">Gênero</label>
                <select id="gender" name="gender">
                    <option value="">Selecione</option>
                    <option value="female" {% if profile.gender == "female" %}selected{% endif %}>Feminino</option>
                    <option value="male" {% if profile.gender == "male" %}selected{% endif %}>Masculino</option>
                </select>
            </div>
            <div>
                <label for="marital_status">Estado civil</label>
                <select id="marital_status" name="marital_status">
                    <option value="">Selecione</option>
                    <option value="single" {% if profile.marital_status == "single" %}selected{% endif %}>Solteiro(a)</option>
                    <option value="married" {% if profile.marital_status == "married" %}selected{% endif %}>Casado(a)</option>
                    <option value="divorced" {% if profile.marital_status == "divorced" %}selected{% endif %}>Divorciado(a)</option>
                    <option value="widowed" {% if profile.marital_status == "widowed" %}selected{% endif %}>Viúvo(a)</option>
                    <option value="stable_union" {% if profile.marital_status == "stable_union" %}selected{% endif %}>União estável</option>
                    <option value="not_informed" {% if profile.marital_status == "not_informed" %}selected{% endif %}>Não informado</option>
                </select>
            </div>
            <div>
                <button type="submit">Continuar</button>
            </div>
        </form>
    </div>
</section>
