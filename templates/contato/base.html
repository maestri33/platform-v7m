<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contato | Assembleia de Deus no Jardim Amália</title>
    <link rel="icon" type="image/png" href="{{ contact_favicon_url }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        .contact-dialog {
            width: min(28rem, calc(100vw - 2rem));
        }

        .contact-dialog::backdrop {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    {% include "contato/partials/_modal_dialog.html" with modal_message=initial_modal_message %}

    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div id="contact-flow">{{ initial_content|safe }}</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
