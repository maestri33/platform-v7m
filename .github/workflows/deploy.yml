name: CD — Production Release & Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── 1. CLOUDFLARE PAGES (LANDINGS ESTÁTICAS ASTRO — CUSTO ZERO / GLOBAL EDGE) ──
  deploy-cloudflare-pages:
    name: Deploy Astro Landings to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro Landings
        run: pnpm turbo run build --filter=@v7m/landing-promotor --filter=@v7m/landing-supletivo

      # 1. Landing Promotor (maestri.group)
      - name: Deploy Landing Promotor
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/landing-promotor/dist --project-name=landing-promotor
          packageManager: pnpm

      # 2. Landing Supletivo (supletivo.net.br)
      - name: Deploy Landing Supletivo
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/landing-supletivo/dist --project-name=landing-supletivo
          packageManager: pnpm


  # ── 2. MIGRAÇÕES AUTOMÁTICAS NO NEON POSTGRES (ZERO-DOWNTIME RELEASE) ────────
  migrate-neon-db:
    name: Apply Neon PostgreSQL Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5

      - name: Migrate Backend Database on Neon
        if: env.NEON_DATABASE_URL_UNPOOLED != ''
        env:
          NEON_DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
        run: |
          cd services/backend
          uv sync --frozen --no-install-project
          uv run python manage.py migrate --noinput

      - name: Migrate Notify Database on Neon
        if: env.NEON_NOTIFY_DATABASE_URL_UNPOOLED != '' || env.NEON_DATABASE_URL_UNPOOLED != ''
        env:
          DATABASE_URL: ${{ secrets.NEON_NOTIFY_DATABASE_URL_UNPOOLED || secrets.NEON_DATABASE_URL_UNPOOLED }}
        run: |
          cd services/notify
          uv pip install -r requirements.txt
          uv run python manage.py migrate --noinput

  # ── 3. CONTAINERS DE SERVIÇOS & APPS (GHCR PARA DEPLOY EM PRODUÇÃO) ─────────
  build-and-push:
    name: Build & Publish All Docker Containers
    runs-on: ubuntu-latest
    needs: [migrate-neon-db]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            context: ./services/backend
            image: ghcr.io/${{ github.repository }}/backend
          - service: notify
            context: ./services/notify
            image: ghcr.io/${{ github.repository }}/notify
          - service: admin
            context: ./apps/admin
            image: ghcr.io/${{ github.repository }}/admin
          - service: app-supletivo
            context: ./apps/app-supletivo
            image: ghcr.io/${{ github.repository }}/app-supletivo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=
            type=ref,event=tag

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-notify:
    name: Notify Production Deployment
    needs: [deploy-cloudflare-pages, migrate-neon-db, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Deployment Success
        run: |
          echo "🚀 V7M Full Deployment Pipeline finished successfully."
          echo "• Cloudflare Pages: 2 static landings deployed to Edge CDN."
          echo "• Neon Database: 100% of PostgreSQL migrations applied."
          echo "• GHCR Containers: 4 containers (Backend, Notify, Admin Portal Unificado, App Supletivo) built and published."
          echo "Commit: ${{ github.sha }} | Ref: ${{ github.ref }}"

