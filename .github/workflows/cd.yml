# CD: dispara após CI verde em main (ou manualmente) e roda no runner
# portal-30104, que vive DENTRO do LXC 30104 — o mesmo padrão do
# ieadpg-amalia-page. O proxy externo (outro LXC) aponta pra :80 deste CT;
# o nginx local passa a raiz pro portal em 127.0.0.1:3000.
#
# ROLLBACK do cutover (1 comando, via workflow_dispatch de diagnóstico ou
# novo step): mover de volta o server block antigo de /opt/nginx-backups,
# remover /etc/nginx/conf.d/portal-ieadpg.conf e `nginx -t && systemctl
# reload nginx` — o site institucional continua intacto em
# /opt/ieadpg-amalia-page/dist.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cd-portal-ieadpg
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    name: Deploy no CT 30104
    runs-on: [self-hosted, portal-ieadpg]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Sincroniza /opt/portal-ieadpg
        run: |
          set -e
          command -v rsync >/dev/null 2>&1 || apt-get install -y rsync
          mkdir -p /opt/portal-ieadpg
          rsync -a --delete \
            --exclude node_modules --exclude .next --exclude .git \
            "$GITHUB_WORKSPACE/" /opt/portal-ieadpg/

      - name: Build
        run: |
          set -e
          cd /opt/portal-ieadpg
          df -h /opt | tail -1
          npm ci --no-audit --no-fund
          npm run build

      - name: Serviço systemd (next start :3000)
        run: |
          set -e
          cat > /etc/systemd/system/portal-ieadpg.service <<'UNIT'
          [Unit]
          Description=Portal IEADPG Jardim Amalia (next start)
          After=network.target

          [Service]
          WorkingDirectory=/opt/portal-ieadpg
          Environment=NODE_ENV=production
          ExecStart=/usr/bin/node node_modules/next/dist/bin/next start -p 3000
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable portal-ieadpg
          systemctl restart portal-ieadpg
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:3000/ \
            && echo "portal de pé em 127.0.0.1:3000" \
            || { systemctl status portal-ieadpg --no-pager | tail -15; exit 1; }

      - name: Cutover nginx (raiz -> portal)
        run: |
          set -e
          TS=$(date +%s)
          mkdir -p /opt/nginx-backups
          # backup da ÁRVORE inteira: rollback restaura tudo de uma vez
          cp -a /etc/nginx "/opt/nginx-backups/etc-nginx-$TS"
          echo "=== estado antes do cutover (fica registrado no log) ==="
          ls -la /etc/nginx/sites-enabled/ 2>/dev/null || true
          grep -rn "default_server" /etc/nginx 2>/dev/null | grep -v "#" | head -6 || true
          grep -rln "ieadpg-amalia-page" /etc/nginx 2>/dev/null || true
          # 1) esvazia sites-enabled: QUALQUER server block lá compete com o
          # portal (o [emerg] anterior veio do sites-enabled/default, que não
          # contém o path do site e escapava do grep por conteúdo)
          mkdir -p "/opt/nginx-backups/sites-enabled-$TS"
          find /etc/nginx/sites-enabled -mindepth 1 -exec mv {} "/opt/nginx-backups/sites-enabled-$TS/" \; 2>/dev/null || true
          # 2) bloco institucional embutido no nginx.conf: remove por contagem
          # de chaves (idempotente — já pode ter sido removido em run anterior)
          if grep -q "ieadpg-amalia-page/dist" /etc/nginx/nginx.conf; then
            awk '
              BEGIN { inblock=0; depth=0; buf="" }
              {
                if (!inblock && $0 ~ /^[ \t]*server[ \t]*\{/) { inblock=1; depth=1; buf=$0 ORS; next }
                if (inblock) {
                  buf = buf $0 ORS
                  line=$0; n=gsub(/\{/,"{",line); m=gsub(/\}/,"}",line); depth+=n-m
                  if (depth<=0) {
                    if (buf !~ /ieadpg-amalia-page\/dist/) printf "%s", buf
                    else print "# (server block do site institucional removido pelo CD do portal; backup em /opt/nginx-backups)"
                    inblock=0; buf=""
                  }
                  next
                }
                print
              }' /etc/nginx/nginx.conf > /tmp/nginx.conf.new
            mv /tmp/nginx.conf.new /etc/nginx/nginx.conf
            echo "server block embutido removido do nginx.conf"
          fi
          cat > /etc/nginx/conf.d/portal-ieadpg.conf <<'CONF'
          server {
            listen 80 default_server;
            listen [::]:80 default_server;
            server_name _;

            # o /sonho antigo vira o próprio portal (https direto: a origem
            # recebe http do proxy e montaria o Location com scheme errado)
            location /sonho/ { return 301 https://$host/; }
            location = /sonho { return 301 https://$host/; }

            # estáticos versionados do Next: cache imutável do próprio app
            location /_next/ {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
            }

            # trilha de vídeo/posters: Cache-Control vem do headers() do Next
            location /scroll-world/ {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
            }

            # HTML e demais rotas: nunca deixar o s-maxage default do Next
            # grudar HTML velho no Cloudflare (deploys ficariam invisíveis)
            location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_hide_header Cache-Control;
              add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate" always;
            }
          }
          CONF
          # -t em linha própria: dentro de A && B a falha de A NÃO aborta com
          # set -e (foi exatamente o bug do primeiro cutover)
          if ! nginx -t; then
            echo "::error::nginx -t reprovou — restaurando a árvore inteira do backup"
            rm -rf /etc/nginx
            cp -a "/opt/nginx-backups/etc-nginx-$TS" /etc/nginx
            nginx -t
            exit 1
          fi
          systemctl reload nginx
          # asserção LOCAL: separa problema de origem de problema de borda
          sleep 1
          curl -fsS --max-time 5 -H "Host: ieadpg.org" http://127.0.0.1/ | grep -q "scroll-world/scrub-engine.js" \
            && echo "cutover feito — origem :80 servindo o portal" \
            || { echo "::error::origem :80 ainda não serve o portal"; exit 1; }

      - name: Diagnóstico do container
        if: always()
        run: |
          echo "=== disco ==="; df -h /opt | tail -1
          echo "=== serviço ==="; systemctl is-active portal-ieadpg || true
          echo "=== listeners ==="; ss -tlnp 2>/dev/null | grep -E ':80|:3000' || true
          echo "=== confs ativos ==="; ls /etc/nginx/conf.d/ /etc/nginx/sites-enabled/ 2>/dev/null || true

      - name: Health check público
        run: |
          fail=0
          # raiz precisa servir o PORTAL (marcador: engine do scroll-world)
          curl -fsS --max-time 15 https://ieadpg.org/ | grep -q "scroll-world/scrub-engine.js" \
            || { echo "::error::raiz não está servindo o portal"; fail=1; }
          curl -fsS --max-time 10 -o /dev/null https://ieadpg.org/icon.png \
            || { echo "::error::/icon.png caiu"; fail=1; }
          curl -fsS --max-time 10 -o /dev/null https://ieadpg.org/scroll-world/am1-a.webp \
            || { echo "::error::posters não servem"; fail=1; }
          # conteúdo indexável do fallback continua no HTML servido
          curl -fsS --max-time 10 https://ieadpg.org/ | grep -q "Paulina Oliveira Gomes" \
            || { echo "::error::fallback indexável sumiu do HTML"; fail=1; }
          exit $fail
