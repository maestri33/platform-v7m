name: CI — V7M Monorepo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. FRONTENDS & MONOREPO QUALITY CHECKS ──────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Global Version Integrity
        run: pnpm run version:check

      - name: Turborepo Lint & Typecheck
        run: pnpm turbo run lint check-types

  # ── 2. FRONTENDS UNIT & COMPONENT TESTS ─────────────────────────────────────
  test-frontends:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Tests
        run: pnpm turbo run test

      - name: Turborepo Production Build
        run: pnpm turbo run build

  # ── 3. BACKEND & NOTIFY SERVICES TEST SUITE ─────────────────────────────────
  test-backend:
    name: Backend & Notify Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: v7m-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Initialize PostgreSQL Test Databases
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=v7m-test-password psql -h localhost -U postgres -c "CREATE USER backend WITH PASSWORD 'v7m-test-password' SUPERUSER;"
          PGPASSWORD=v7m-test-password psql -h localhost -U postgres -c "CREATE DATABASE backend OWNER backend;"
          PGPASSWORD=v7m-test-password psql -h localhost -U postgres -c "CREATE USER notify WITH PASSWORD 'v7m-test-password' SUPERUSER;"
          PGPASSWORD=v7m-test-password psql -h localhost -U postgres -c "CREATE DATABASE notify OWNER notify;"
          PGPASSWORD=v7m-test-password psql -h localhost -U postgres -c "CREATE USER evolution WITH PASSWORD 'v7m-test-password' SUPERUSER;"
          PGPASSWORD=v7m-test-password psql -h localhost -U postgres -c "CREATE DATABASE evolution OWNER evolution;"

      - name: Test Core Backend (services/backend)
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: ci-test-django-secret-key-32chars-min
          DATABASE_URL: postgresql://backend:v7m-test-password@localhost:5432/backend
          TEST_MODE: "1"
          TEST_MODE_ALLOWED_HOSTS: "*"
          NOTIFY_SERVER_URL: http://localhost:8000
          NOTIFY_API_KEY: ci_test_key
          CPFHUB_API_KEY: ci_dummy
        run: |
          cd services/backend
          uv sync
          uv pip install pytest pytest-django pytest-asyncio psycopg[binary] schemathesis
          uv run pytest --tb=short

      - name: Test Notify Server (services/notify)
        env:
          SECRET_KEY: ci-test-notify-secret-key-32chars-min
          DATABASE_URL: postgresql://notify:v7m-test-password@localhost:5432/notify
          EVOLUTION_DATABASE_URL: postgresql://evolution:v7m-test-password@localhost:5432/evolution
          EVOLUTION_GO_BASE_URL: http://localhost:4000
          EVOLUTION_GO_API_KEY: ci_go_key
          TEST_MODE: "1"
          TEST_MODE_ALLOWED_HOSTS: "*"
        run: |
          cd services/notify
          uv pip install -r requirements.txt
          uv pip install pytest pytest-django
          uv run pytest --tb=short
