# CI do portal — espelha o padrão do ieadpg-amalia-page:
# verificação em runner do GitHub; deploy é um workflow separado (cd.yml)
# que só roda depois deste ficar verde em main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Instalar Chromium do Playwright
        run: npx playwright install chromium --with-deps

      - name: E2E (desktop, mobile, mobile-landscape)
        run: npm run test:e2e

      - name: Guardar relatório do e2e quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Sanidade do prerender
        # o fallback indexável e o JSON-LD são contrato do site — se sumirem
        # do HTML estático, o build está verde mas o produto quebrou
        run: |
          test -f .next/server/app/index.html
          grep -q "Paulina Oliveira Gomes" .next/server/app/index.html
          grep -q '"@type":\["Church","Organization"\]' .next/server/app/index.html
          grep -q "wa.me/5542999384069" .next/server/app/index.html
          echo "prerender ok"
