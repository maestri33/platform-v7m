name: Deploy
# CD: ao dar push na main, o runner self-hosted DESTE servidor (CT 30102)
# atualiza o código, rebuilda e reinicia o serviço. O build é o gate (falhou → não reinicia).
on:
  push:
    branches: [main]
concurrency:
  group: deploy-app-supletivo
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, app-supletivo]
    steps:
      - name: Atualiza, builda e reinicia
        run: |
          set -e
          cd /opt/app-supletivo
          git fetch --all --prune
          git reset --hard origin/main
          # proveniência inlinada no build → exposta em /healthz
          export GIT_SHA=$(git rev-parse --short HEAD)
          export BUILD_AT=$(date -u +%FT%TZ)
          npm ci --no-audit --no-fund
          # Teto de heap p/ o build caber no servidor (3GB RAM + 1GB swap): o CopilotKit engordou
          # o build e sem o teto o Node é morto por OOM (exit 137). 3200MB passa dentro do disponível.
          NODE_OPTIONS="--max-old-space-size=3200" npm run build
          systemctl restart app-supletivo
          sleep 4
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          # healthcheck de proveniência: o SHA servido tem que bater com o que acabou de subir
          LIVE=$(curl -fsS http://127.0.0.1:3000/healthz)
          echo "deploy OK — app no ar — /healthz: $LIVE"
          echo "$LIVE" | grep -q "$GIT_SHA" || { echo "ERRO: /healthz não reflete $GIT_SHA"; exit 1; }
