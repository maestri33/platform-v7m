services:
  app-supletivo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_AT: ${BUILD_AT:-local}
        URL_BACKEND: ${URL_BACKEND:-http://backend-web:8000}
    image: app-supletivo:latest
    container_name: app-supletivo
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - URL_BACKEND=${URL_BACKEND:-http://backend-web:8000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
