name: CI
# Gate do front em runner efêmero sem acesso à rede/segredos de produção.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependências (lockfile exato)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (standalone)
        run: npm run build

      - name: Playwright (auth + funil completo)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
