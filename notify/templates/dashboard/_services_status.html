<table>
  <tr><th>serviço</th><th>estado</th><th>detalhe</th><th>endpoint</th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r.name }}</td>
    <td>{% if r.ok %}<span class="pill st-sent">ok</span>{% else %}<span class="pill st-failed">fora</span>{% endif %}</td>
    <td class="mono">{{ r.detail }}</td>
    <td class="muted mono">{{ r.url|default:"—" }}</td>
  </tr>
  {% endfor %}
</table>
<div class="meta" style="margin-top:6px">Consulta feita agora, direto em cada serviço (timeout curto). IA fora não segura envio — só as sugestões somem.</div>
