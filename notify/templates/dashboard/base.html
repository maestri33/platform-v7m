<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Notify · Dashboard{% endblock %}</title>
<script src="/dashboard/htmx.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1c222c; --bd:#262d3a;
    --tx:#e6e9ef; --mut:#8a93a6; --acc:#5b9dff;
    --sent:#2ea043; --failed:#e5534b; --pending:#d29922; --sending:#3b82f6; --skipped:#6b7280;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 ui-sans-serif,system-ui,Segoe UI,Roboto,Arial}
  a{color:var(--acc);text-decoration:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sp{color:var(--mut);font-weight:400}
  main{padding:20px;max-width:1200px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
  .kpi .n{font-size:22px;font-weight:700}
  .kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .kpi.warn .n{color:var(--failed)}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .acct{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel2);cursor:pointer}
  .acct:hover{border-color:var(--acc)}
  .acct .slug{font-weight:600}
  .acct .meta{color:var(--mut);font-size:12px;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
  th{color:var(--mut);font-weight:600;font-size:12px}
  .muted{color:var(--mut)}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;color:#0b0d10}
  .st-sent{background:var(--sent);color:#fff}.st-failed{background:var(--failed);color:#fff}
  .st-pending{background:var(--pending)}.st-sending{background:var(--sending);color:#fff}
  .st-skipped{background:var(--skipped);color:#fff}
  .tag{display:inline-block;padding:1px 6px;border:1px solid var(--bd);border-radius:6px;font-size:11px;color:var(--mut);margin-right:4px}
  .warnrow{color:var(--failed);font-weight:600}
  input,select,button{background:var(--panel2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit}
  button{cursor:pointer}
  button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:24px}
  .login h1{font-size:18px;margin:0 0 4px}
  .login p{color:var(--mut);margin:0 0 16px}
  .login form{display:flex;flex-direction:column;gap:10px}
  .err{color:var(--failed);font-size:13px}
  .htmx-indicator{opacity:0;transition:opacity .2s}.htmx-request .htmx-indicator{opacity:1}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
